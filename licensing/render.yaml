services:
  - type: web
    name: br-license-bot
    runtime: python
    plan: free
    rootDir: licensing
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn brlicense.app:create_app --factory --host 0.0.0.0 --port $PORT --no-access-log
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPPORT_URL
        sync: false
      - key: TERMS_TEXT
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: KEY_PEPPER
        generateValue: true
      - key: KEY_ENCRYPTION_KEY
        sync: false
