name: Test Telegram licensing and build licensed client
on:
  pull_request:
    paths:
      - 'licensing/**'
      - 'Inject/LicenseGate.swift'
      - 'Inject/BRMenuEntry.swift'
      - 'scripts/build_dylib.sh'
      - 'scripts/license_config.py'
      - '.github/workflows/licensing.yml'
  workflow_dispatch:
    inputs:
      license_api_url:
        description: 'Public HTTPS license server URL (empty = compile check only)'
        required: false
        type: string
      license_bot_url:
        description: 'https://t.me/YOUR_BOT (empty = compile check only)'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: licenses-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: license_test
          POSTGRES_PASSWORD: test_password_only
          POSTGRES_DB: license_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: licensing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: licensing/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Test SQLite fixtures and Telegram handlers
        run: python -m pytest -q
      - name: Test PostgreSQL locks, duplicate payments and device races
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://license_test:test_password_only@localhost:5432/license_test
        run: python -m pytest -q
  licensed-client:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build with iPhone SDK (test endpoints unless manually configured)
        env:
          BRMENU_LICENSED: '1'
          BRMENU_LICENSE_API_URL: ${{ inputs.license_api_url || 'https://license.example.invalid' }}
          BRMENU_LICENSE_BOT_URL: ${{ inputs.license_bot_url || 'https://t.me/example' }}
        run: bash scripts/build_dylib.sh
      - name: Publish configured client only
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.license_api_url != '' && inputs.license_bot_url != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: BRMenu-Licensed
          path: |
            dist/BRMenuInject.dylib
            dist/BRMenuInject-SHA256.txt
          retention-days: 7
