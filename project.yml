name: BRMenu
options:
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    GENERATE_INFOPLIST_FILE: YES
targets:
  DiagnosticMenu:
    type: framework
    platform: iOS
    sources: [Sources/DiagnosticMenu]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.brmenu.diagnostics
        SKIP_INSTALL: NO
        DEFINES_MODULE: YES
  BRMenuDemo:
    type: application
    platform: iOS
    sources: [Demo]
    dependencies:
      - target: DiagnosticMenu
        embed: true
    info:
      path: Generated/Demo-Info.plist
      properties:
        CFBundleDisplayName: BR Menu Demo
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.brmenu.demo
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
  BRMenuUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: BRMenuDemo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.brmenu.uitests
schemes:
  BRMenuDemo:
    build:
      targets:
        BRMenuDemo: all
    test:
      targets: [BRMenuUITests]
